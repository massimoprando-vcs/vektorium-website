name: Static website quality

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Use Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Test the source transformer
        run: python3 -B -m unittest discover -s scripts -p 'test_harden_site.py' -v

      - name: Test the LinkedIn article generator without writing files
        run: node scripts/render_linkedin_posts.mjs --test

      - name: Verify generated articles and archive are current
        run: node scripts/render_linkedin_posts.mjs --check

      - name: Check static content and security invariants
        run: python3 -B scripts/validate_site.py --self-test

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in assets/*.js scripts/*.mjs; do
            node --check "$file"
          done

      - name: Test frontend consent and interaction safeguards
        run: node scripts/test_site.mjs

      - name: Test isolated build boundaries and fail-closed environments
        run: node scripts/test_build.mjs

      - name: Build the dependency-free production output
        env:
          VERCEL_ENV: production
        run: npm run build

      - name: Confirm development files cannot be published
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path('.')
          output = root / 'dist'
          assert len(list(output.glob('*.html'))) == len(list(root.glob('*.html')))
          assert len(list(output.glob('*.html'))) == 39, 'Review the explicit public-page manifest before changing coverage'
          for forbidden in ('.git', '.github', 'scripts', 'docs', 'content', 'node_modules', 'README.md', 'package.json', 'package-lock.json', 'vercel.json', 'build-report.json'):
              assert not (output / forbidden).exists(), f'Development file leaked into dist: {forbidden}'
          assert (output / '.well-known/security.txt').is_file()
          print('Public output isolation passed.')
          PY

      - name: Build and verify the non-indexable preview
        env:
          VERCEL_ENV: preview
        run: |
          npm run build
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class Robots(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.tags = []
              def handle_starttag(self, tag, attrs):
                  values = dict(attrs)
                  if tag == 'meta' and values.get('name', '').lower() == 'robots':
                      self.tags.append(values.get('content', '').lower())
          for page in Path('dist').glob('*.html'):
              parsed = Robots()
              parsed.feed(page.read_text(encoding='utf-8'))
              assert len(parsed.tags) == 1 and 'noindex' in parsed.tags[0], f'Preview page can be indexed: {page}'
          assert Path('dist/robots.txt').read_text(encoding='utf-8') == 'User-agent: *\nDisallow: /\n'
          print('Preview noindex safeguards passed. This is not access control.')
          PY
